[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"

# API proxy redirect must be configured in Netlify Dashboard
# Site Settings > Build & deploy > Redirects and rewrites
# Add rule: /api/*  https://YOUR-BACKEND.onrender.com/api/:splat  200
# The backend URL varies per deploy and cannot be hardcoded here.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200