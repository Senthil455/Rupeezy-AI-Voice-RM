# ─── Netlify Configuration ────────────────────────────────────────────────────
# This file tells Netlify how to build the project and handle routing.

[build]
  # The frontend folder is where package.json lives
  base    = "frontend"
  # Vite outputs built files here
  publish = "dist"
  # Build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# ─── Redirects ────────────────────────────────────────────────────────────────

# 1. Proxy /api/* calls to your deployed backend.
#    ⚠️  Replace the `to` URL below with your actual backend URL
#    (e.g. from Render, Railway, Fly.io, etc.)
#    Example: https://rupeezy-ai-backend.onrender.com/api/:splat
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force  = true

# 2. SPA fallback — send all unmatched routes to index.html
#    This fixes the "Page not found" error for client-side routes
#    like /agent, /leads, /analytics, etc.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
